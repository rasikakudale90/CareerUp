services:
  - type: web
    name: careerup-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: "CareerUp AI - Backend"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: SUPABASE_BUCKET_NAME
        value: "resumes"
